first_author:
  - title: "From Scaling Relations to Physical Laws: Constraining the Physics of Star Formation Across Local Galaxies"
    authors: "<b>den Brok</b>, Bacchini, Boogaard et al."
    year: 2026
    ref: "ALMA2040 White Paper Series"
    label: "White paper"
    arxiv: "2610.21891"
    topic: "co"
    figure: "2610.21891.jpg"
    figure_alt: "Comparison of how well current ALMA and ALMA2040 constrain molecular gas temperature and density from CO and 13CO lines"
    summary: "How cold gas turns into stars is still one of the big open questions in galaxy evolution. Gravity, turbulence and feedback from stars all reproduce the same galaxy-wide trends, so telling them apart requires measuring the temperature, density and chemistry of the gas in individual molecular clouds across many galaxies. This white paper shows how a next-generation ALMA (ALMA2040) could make millions of such measurements, needing minutes per pointing where today's ALMA needs hours."
  - title: "Constraining resolved extragalactic R<sub>21</sub> variation with well calibrated ALMA observations"
    authors: "<b>den Brok</b>, Oakes, Leroy et al."
    year: 2025
    ref: "ApJ, 988, 162"
    arxiv: "2506.09125"
    topic: "co"
    figure: "2506.09125.jpg"
    figure_alt: "ALMA CO(1-0) maps of nearby galaxies next to their optical images"
    summary: "Astronomers measure molecular gas with either the CO(1-0) or the CO(2-1) line and convert between the two using their ratio, R<sub>21</sub>. Using consistently calibrated ALMA maps of 14 nearby galaxies, we show that this ratio varies much less from galaxy to galaxy than previously thought, with a typical value of 0.64 that rises toward galaxy centers. For most studies, assuming a fixed ratio does not noticeably bias gas mass estimates."
  - title: "CO isotopologue-derived molecular gas conditions and CO-to-H<sub>2</sub> conversion factors in M51"
    authors: "<b>den Brok</b>, Jiménez-Donaire, Leroy et al."
    year: 2025
    ref: "AJ, 169, 18"
    arxiv: "2410.21399"
    topic: "co"
    figure: "2410.21399.jpg"
    figure_alt: "Maps of gas temperature, beam filling factor and optical depth across the center of M51"
    summary: "Combining three major interferometer surveys of the Whirlpool Galaxy (M51), we map rare CO isotopologues across its center and inner spiral arms at 170 pc resolution. Modeling these lines reveals the temperature and density of the gas, and how much CO light corresponds to a given mass of molecular gas: less gas per unit of CO light than in the Milky Way. The study shows that careful line modeling is needed to weigh molecular gas reliably."
  - title: "Resolved low-J <sup>12</sup>CO excitation at 190 parsec resolution across NGC 2903 and NGC 3627"
    authors: "<b>den Brok</b>, Leroy, Usero et al."
    year: 2023
    ref: "MNRAS, 526, 6347"
    arxiv: "2310.18407"
    topic: "co"
    figure: "2310.18407.jpg"
    figure_alt: "CO maps of NGC 3627 compared with Hubble, JWST and MUSE images"
    summary: "Ratios between the lowest CO transitions are sensitive to the temperature and density of molecular gas. Using ALMA maps of three CO lines at 190 pc resolution across NGC 2903 and NGC 3627, we find that the ratios rise clearly toward the galaxy centers, with CO(3-2) reacting most strongly. Changes in gas temperature appear to be the main driver."
  - title: "Wide-field CO isotopologue emission and the CO-to-H<sub>2</sub> factor across the nearby spiral galaxy M101"
    authors: "<b>den Brok</b>, Bigiel, Chastenet et al."
    year: 2023
    ref: "A&A, 676, 93"
    arxiv: "2302.03044"
    doi: "10.1051/0004-6361/202245718"
    topic: "co"
    figure: "2302.03044.jpg"
    figure_alt: "Optical image of the galaxy M101 with contours of CO emission"
    summary: "The CO-to-H<sub>2</sub> conversion factor turns CO brightness into molecular gas mass, but it is not the same everywhere. New IRAM 30-m maps of CO and its rarer isotopologues across M101 show that the factor drops by about a factor of ten in the central 2 kpc. Taking this into account, star formation uses up the gas in the center about ten times faster than otherwise estimated."
  - title: "BASS. XXVIII. Near-infrared Data Release 2: High-ionization and Broad Lines in Active Galactic Nuclei"
    authors: "<b>den Brok</b>, Koss, Trakhtenbrot et al."
    year: 2022
    ref: "ApJS, 261, 7"
    arxiv: "2207.12426"
    doi: "10.3847/1538-4365/ac5b66"
    topic: "agn"
    figure: "2207.12426.jpg"
    figure_alt: "Bar chart of coronal line detection rates versus ionization potential for different AGN types"
    summary: "We present near-infrared VLT spectra of 168 nearby active galactic nuclei (AGN) from the BASS survey. Highly ionized coronal lines, which require very energetic radiation, appear in about half of them and track the X-ray output of the AGN more tightly than the commonly used optical [O III] line. Together with the first release, this is the largest near-infrared AGN spectral sample to date, with 266 AGN."
  - title: "A CO isotopologue Line Atlas within the Whirlpool galaxy Survey (CLAWS)"
    authors: "<b>den Brok</b>, Bigiel, Sliwa et al."
    year: 2022
    ref: "A&A, 662, 89"
    arxiv: "2201.05165"
    doi: "10.1051/0004-6361/202142247"
    topic: "co"
    figure: "2201.05165.jpg"
    data: "https://www.iram.fr/ILPA/LP020/"
    figure_alt: "Grid of maps of the Whirlpool Galaxy in many different molecular lines"
    summary: "CLAWS is a deep, 149-hour IRAM 30-m survey of faint CO isotopologues and other molecules across the full disk of the Whirlpool Galaxy, M51. We present the data and show how the line ratios change with distance from the center and between spiral arms and the regions between them. These changes most likely reflect variations in the optical depth of the gas, possibly together with changes in its chemical makeup."
  - title: "New constraints on the <sup>12</sup>CO(2-1)/(1-0) line ratio across nearby disc galaxies"
    authors: "<b>den Brok</b>, Chatzigiannakis, Bigiel et al."
    year: 2021
    ref: "MNRAS, 504, 3221"
    arxiv: "2103.10442"
    doi: "10.1093/mnras/stab859"
    topic: "co"
    figure: "2103.10442.jpg"
    figure_alt: "Maps of the CO(2-1)/(1-0) line ratio across nine nearby spiral galaxies"
    summary: "Molecular gas masses are measured from either the CO(2-1) or the CO(1-0) line, so comparing studies requires knowing their ratio, R<sub>21</sub>. Combining new and archival maps of nine nearby spiral galaxies, we find an average R<sub>21</sub> of 0.64 with only weak changes across each disk, and slightly higher values where gas is denser and star formation more intense."
  - title: "Probing the AGN unification model at redshift z ~ 3 with MUSE observations of giant Lya nebulae"
    authors: "<b>den Brok</b>, Cantalupo, Mackenzie et al."
    year: 2020
    ref: "MNRAS, 495, 1874"
    arxiv: "2005.01732"
    doi: "10.1093/mnras/staa1269"
    topic: "agn"
    figure: "2005.01732.jpg"
    figure_alt: "MUSE maps of giant Lyman-alpha nebulae around two active galactic nuclei"
    summary: "The AGN unification model says that different types of active galactic nuclei are the same objects seen from different angles. With MUSE, we compared the giant glowing hydrogen (Lyman-alpha) nebulae around type I and type II AGN in the early Universe (z ~ 3). Nebulae around type II AGN are more lopsided, as expected if their light escapes in cones, which supports the unification model at early times."

